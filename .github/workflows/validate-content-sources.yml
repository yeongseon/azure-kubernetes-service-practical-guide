name: Validate Content Sources

on:
  pull_request:
    paths:
      # Trigger set aligned with the sibling Azure Container Apps practical
      # guide, trimmed for repo-specific structure (this repo has no apps/,
      # labs/, jobs/, or infra/ directories today). If any of those
      # directories are added later, extend this list before landing content
      # under them so CI does not silently skip validation.
      - 'docs/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'mkdocs.yml'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'mkdocs.yml'
      - '.github/workflows/**'

jobs:
  validate-content-sources:
    name: Validate Content Source Metadata
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Run doctests for content_scope
        run: |
          python -m doctest scripts/lib/content_scope.py -v

      - name: Validate mermaid format
        run: |
          python scripts/validate_mermaid_format.py
      
      - name: Validate mermaid syntax
        run: |
          python scripts/validate_mermaid_syntax.py
      
      - name: Validate content sources
        run: |
          python scripts/validate_content_sources.py
      
      - name: Check for missing diagram IDs
        run: |
          # Count mermaid blocks
          MERMAID_COUNT=$(grep -r '```mermaid' docs/ --include="*.md" | wc -l)
          
          # Count diagram-id comments
          DIAGRAM_ID_COUNT=$(grep -r '<!-- diagram-id:' docs/ --include="*.md" | wc -l)
          
          echo "Mermaid blocks: $MERMAID_COUNT"
          echo "Diagram IDs: $DIAGRAM_ID_COUNT"
          
          if [ "$MERMAID_COUNT" -ne "$DIAGRAM_ID_COUNT" ]; then
            echo "::error::Mismatch! Some mermaid blocks are missing diagram-id comments."
            echo "Missing: $((MERMAID_COUNT - DIAGRAM_ID_COUNT)) diagram IDs"
            exit 1
          fi
          
          echo "All mermaid blocks have diagram-id comments."
      
      - name: Check for content_sources in new/modified files
        run: |
          # Get list of changed markdown files with mermaid
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD~1' }} -- 'docs/**/*.md' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No markdown files changed."
            exit 0
          fi
          
          MISSING_SOURCES=""
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              # Check if file has mermaid
              if grep -q '```mermaid' "$file"; then
                # Check if file has content_sources
                if ! grep -q 'content_sources:' "$file"; then
                  MISSING_SOURCES="$MISSING_SOURCES\n  - $file"
                fi
              fi
            fi
          done
          
          if [ -n "$MISSING_SOURCES" ]; then
            echo "::error::Files with mermaid diagrams missing content_sources metadata:"
            echo -e "$MISSING_SOURCES"
            exit 1
          fi
          
          echo "All changed files with mermaid diagrams have content_sources metadata."

  validate-cli-explanations:
    name: Validate CLI Explanation Tables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CLI explanation doctests
        run: |
          python -m doctest scripts/validate_cli_explanations.py -v

      - name: Validate CLI explanation tables
        run: |
          python scripts/validate_cli_explanations.py

  validate-pii:
    name: Validate PII
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run doctests for scripts/validate_pii.py
        run: |
          python -m doctest scripts/validate_pii.py -v

      - name: Detect leaked identifiers in changed Markdown (blocking)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'docs/**/*.md' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No changed Markdown files to scan."
            exit 0
          fi
          echo "Scanning changed Markdown files:"
          echo "$CHANGED"
          MISSING=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done <<< "$CHANGED"
          if [ -n "$MISSING" ]; then
            echo "::error::Expected changed Markdown file(s) missing from checkout:$MISSING"
            exit 1
          fi
          if ! python scripts/validate_pii.py --files $CHANGED; then
            echo "::error::PII validation failed on changed files. Remove real subscription/tenant/object IDs or real email addresses, or allowlist confirmed-safe example values in scripts/pii-allowlist.txt."
            exit 1
          fi

      - name: Full advisory PII scan (non-blocking)
        continue-on-error: true
        run: |
          python scripts/validate_pii.py

  validate-mslearn-urls:
    name: Validate MSLearn URLs
    runs-on: ubuntu-latest
    # Only run on push to main to avoid rate limiting
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests
      
      - name: Validate MSLearn URLs
        run: |
          python scripts/validate_mslearn_urls.py --verbose
        continue-on-error: true  # Don't fail build on URL issues, just report

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install MkDocs
        run: |
          pip install -r requirements-docs.txt
      
      - name: Build with strict mode
        run: |
          mkdocs build --strict
